services:
  app:
    build: .
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=file:/app/storage/judging.db
      - STORAGE_DIR=/app/storage
      - BACKUP_DIR=/app/storage/backups
      - SEED_ADMIN_USERNAME=admin
      - SEED_ADMIN_PASSWORD=Juri#2026
    volumes:
      - ./storage:/app/storage
