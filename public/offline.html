<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <title>Tidak ada koneksi · RWSA 2026</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0a0908; color: #f1e9d6; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; text-align: center; box-sizing: border-box; }
      h1 { font-family: Georgia, "Times New Roman", serif; letter-spacing: .06em; color: #e8cf8a; font-size: 1.5rem; margin: 1rem 0 .5rem; }
      p { max-width: 28rem; line-height: 1.55; color: #a39a85; margin: .35rem 0; }
      .ring { width: 72px; height: 72px; border-radius: 50%; border: 2px solid #c9a24b; display: grid; place-items: center; color: #c9a24b; font-family: Georgia, serif; font-size: 1.4rem; }
      button { margin-top: 1.25rem; min-height: 44px; padding: .5rem 1.4rem; border-radius: .6rem; border: 1px solid #e8cf8a; background: linear-gradient(180deg,#ecd48f,#c9a24b 60%,#a88434); color: #1a1304; font-weight: 600; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="ring">RW</div>
      <h1>Tidak ada koneksi</h1>
      <p>Perangkat sedang offline. Nilai yang sudah Anda isi <strong>tetap tersimpan di perangkat</strong> dan akan terkirim otomatis begitu koneksi kembali.</p>
      <p>Nilai baru dianggap <strong>final</strong> hanya setelah server mengonfirmasi.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
